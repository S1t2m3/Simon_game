<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simon Says Game</h1>
        <h2>Press any key to start the game</h2>
        <div class="buttons">
            <div class="upper-line">
            <div class="btn red" id="red" type="submit"></div>
            <div class="btn green" id="green" type="submit"></div>
            </div>
            <div class="lower-line">
            <div class="btn yellow" id="yellow" type="submit"></div>
            <div class="btn purple" id="purple" type="submit"></div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
